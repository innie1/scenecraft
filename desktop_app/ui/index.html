<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Scenecraft</title>
<style>
  :root {
    --bg: #121212;
    --panel: #1c1c1c;
    --panel-raised: #232323;
    --border: #2c2c2c;
    --text: #e8e8e6;
    --text-muted: #8a8a86;
    --accent: #7f77dd;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", sans-serif;
  }
  button {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 14px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #121212; border: none; }

  .screen { height: 100vh; display: flex; flex-direction: column; }

  /* ---------- Screen 1: start ---------- */
  .start-screen {
    align-items: center;
    justify-content: center;
  }
  .start-buttons { display: flex; gap: 16px; }
  .start-buttons button.large {
    padding: 14px 28px;
    font-size: 14px;
    border-radius: 8px;
  }

  /* ---------- Screen 2: editor ---------- */
  header {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex: 0 0 auto;
  }
  header h1 { font-size: 15px; font-weight: 500; margin: 0; }
  .header-left { display: flex; align-items: center; gap: 10px; }
  #back-btn { width: 30px; height: 30px; padding: 0; display: flex; align-items: center; justify-content: center; border-radius: 6px; }
  #back-btn svg { width: 16px; height: 16px; }
  #header-title { cursor: pointer; border-radius: 4px; padding: 2px 6px; margin: 0 -6px; }
  #header-title:hover { background: var(--panel); }
  .header-title-input {
    font-size: 15px; font-weight: 500; font-family: inherit; background: var(--panel);
    border: 1px solid var(--accent); color: var(--text); border-radius: 4px; padding: 2px 6px;
  }

  .editor-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 16px 20px;
    gap: 12px;
    overflow: hidden;
    min-height: 0;
  }

  /* Top row: narrow icon rail + preview/transcript, side by side */
  .editor-top { display: flex; gap: 10px; flex: 1; min-height: 0; }

  .tool-rail-vertical {
    flex: 0 0 32px; width: 32px; display: flex; flex-direction: column; gap: 8px;
  }
  .tool-rail-vertical .icon-btn { width: 32px; height: 32px; }
  .tool-rail-vertical .icon-btn svg { width: 16px; height: 16px; }

  .preview-area { flex: 1; min-width: 0; position: relative; display: flex; }

  .preview-wrap { position: relative; flex: 1; min-height: 0; background: #000; border-radius: 8px; overflow: hidden; }
  .preview-wrap video { width: 100%; height: 100%; object-fit: contain; }
  .preview-empty {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--text-muted); font-size: 13px; pointer-events: none;
  }

  .timeline-container { display: flex; flex-direction: column; gap: 8px; flex: 0 0 auto; }
  .trim-controls { display: flex; gap: 10px; align-items: center; font-size: 13px; flex: 0 0 auto; }
  .trim-controls input { width: 70px; background: var(--panel); border: 1px solid var(--border);
    color: var(--text); border-radius: 4px; padding: 5px 8px; }

  /* Composer: local, offline pattern-matched edit commands */
  .composer-bar { display: flex; gap: 8px; flex: 0 0 auto; }
  #composer-input {
    flex: 1; background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 8px 12px; font-size: 13px;
  }
  #composer-input:focus { outline: none; border-color: var(--accent); }
  #composer-status { flex: 0 0 auto; align-self: center; color: var(--text-muted); font-size: 12px; max-width: 260px; }

  #settings-btn { width: 30px; height: 30px; padding: 0; display: flex; align-items: center; justify-content: center; border-radius: 6px; }
  #settings-btn svg { width: 16px; height: 16px; }
  .header-right { display: flex; gap: 8px; align-items: center; }

  .timeline-scroll {
    overflow-x: auto; overflow-y: hidden; border: 1px solid var(--border); border-radius: 8px;
    background: var(--panel);
  }
  .timeline-ruler { height: 20px; position: relative; border-bottom: 1px solid var(--border); }
  .timeline-ruler span {
    position: absolute; top: 3px; font-size: 10px; color: var(--text-muted); white-space: nowrap;
  }
  .track-row { display: flex; align-items: stretch; border-bottom: 1px solid var(--border); }
  .track-row:last-child { border-bottom: none; }
  .track-label {
    flex: 0 0 56px; padding: 0 8px; font-size: 11px; color: var(--text-muted);
    display: flex; align-items: center; border-right: 1px solid var(--border);
    position: sticky; left: 0; background: var(--panel);
  }
  .track-lane { position: relative; height: 40px; }
  .clip-box {
    position: absolute; top: 4px; bottom: 4px; border-radius: 4px; padding: 4px 6px;
    font-size: 11px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    cursor: grab; border: 1px solid transparent; user-select: none;
  }
  .clip-box.video { background: #4c4a8a; color: var(--text); }
  .clip-box.audio { background: #3d6b5c; color: var(--text); }
  .clip-box.text { background: #7a5a3d; color: var(--text); }
  .clip-box.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .clip-box.dragging { opacity: 0.8; cursor: grabbing; }

  .icon-btn {
    width: 36px; height: 36px; padding: 0; display: flex; align-items: center; justify-content: center;
    border-radius: 8px;
  }
  .icon-btn svg { width: 18px; height: 18px; }
  .icon-btn.active { border-color: var(--accent); color: var(--accent); }
  .status-text { color: var(--text-muted); font-size: 12px; margin-left: 4px; }

  /* Transcript panel fills the same slot the preview normally occupies */
  .transcript-panel {
    flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px;
    background: var(--panel-raised); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px; overflow: hidden;
  }
  .transcript-panel-header { display: flex; justify-content: space-between; align-items: center; font-size: 12px; flex: 0 0 auto; }
  .transcript-panel-header strong { color: var(--text); }
  #transcript-search {
    flex: 0 0 auto; background: var(--bg); border: 1px solid var(--border);
    color: var(--text); border-radius: 4px; padding: 6px 8px; font-size: 12px;
  }
  .transcript-list { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
  .transcript-row { padding: 6px 8px; border-radius: 4px; cursor: pointer; line-height: 1.4; font-size: 12px; }
  .transcript-row:hover { background: var(--bg); }
  .transcript-row .ts { color: var(--accent); margin-right: 6px; font-variant-numeric: tabular-nums; }

  /* ---------- Modal (shared) ---------- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    display: none; align-items: center; justify-content: center; z-index: 10;
  }
  .modal {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 20px; width: 340px; max-width: 90vw; max-height: 70vh; display: flex;
    flex-direction: column; gap: 12px;
  }
  .modal h2 { margin: 0; font-size: 14px; font-weight: 500; }
  .modal input[type="text"] {
    width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 8px 10px; font-size: 13px;
  }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .modal-body { overflow-y: auto; }
  .project-list { display: flex; flex-direction: column; gap: 4px; max-height: 40vh; overflow-y: auto; }
  .project-row {
    padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  .project-row:hover { border-color: var(--accent); }
</style>
</head>
<body>

<div id="start-screen" class="screen start-screen">
  <div class="start-buttons">
    <button id="new-project-btn" class="primary large">New project</button>
    <button id="open-project-btn" class="large">Open project</button>
  </div>
</div>

<div id="editor-screen" class="screen editor-screen" style="display:none;">
  <header>
    <div class="header-left">
      <button id="back-btn" title="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </button>
      <h1 id="header-title">Scenecraft</h1>
    </div>
    <div class="header-right">
      <button id="settings-btn" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82A1.65 1.65 0 0 0 3 13.09H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
      <button id="export-btn" class="primary">Export</button>
    </div>
  </header>

  <main class="editor-main">
    <div class="editor-top">
      <div class="tool-rail-vertical">
        <button id="import-btn" class="icon-btn" title="Import video">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
        </button>
        <button id="audio-btn" class="icon-btn" title="Add audio (coming soon)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18V5l12-2v13"></path>
            <circle cx="6" cy="18" r="3"></circle>
            <circle cx="18" cy="16" r="3"></circle>
          </svg>
        </button>
        <button id="text-btn" class="icon-btn" title="Add text (coming soon)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="4 7 4 4 20 4 20 7"></polyline>
            <line x1="9" y1="20" x2="15" y2="20"></line>
            <line x1="12" y1="4" x2="12" y2="20"></line>
          </svg>
        </button>
        <button id="transcribe-btn" class="icon-btn" title="Transcribe">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
        </button>
      </div>

      <div class="preview-area">
        <div class="preview-wrap">
          <video id="preview" controls></video>
          <div id="preview-empty" class="preview-empty">No video imported yet</div>
        </div>

        <div id="transcript-panel" class="transcript-panel" style="display:none;">
          <div class="transcript-panel-header">
            <strong>Transcript</strong>
            <span id="transcript-status" style="color: var(--text-muted);"></span>
          </div>
          <input id="transcript-search" type="text" placeholder="Search transcript…" />
          <div id="transcript-list" class="transcript-list"></div>
        </div>
      </div>
    </div>

    <div class="timeline-container">
      <div class="trim-controls">
        <label>Start (s) <input id="start" type="number" min="0" step="0.1" value="0" /></label>
        <label>End (s) <input id="end" type="number" min="0" step="0.1" value="5" /></label>
        <button id="cut-btn">Cut</button>
        <span id="status" class="status-text"></span>
      </div>

      <div class="timeline-scroll">
        <div class="track-row">
          <span class="track-label"></span>
          <div id="timeline-ruler" class="timeline-ruler"></div>
        </div>
        <div class="track-row">
          <span class="track-label">Video</span>
          <div id="track-lane-video" class="track-lane"></div>
        </div>
        <div class="track-row">
          <span class="track-label">Audio</span>
          <div id="track-lane-audio" class="track-lane"></div>
        </div>
        <div class="track-row">
          <span class="track-label">Text</span>
          <div id="track-lane-text" class="track-lane"></div>
        </div>
      </div>
    </div>

    <div class="composer-bar">
      <input id="composer-input" type="text"
             placeholder='Type an edit, e.g. "cut the first 5 seconds", "add music", "search for fox", "export"' />
      <button id="composer-send" class="primary">Run</button>
      <span id="composer-status"></span>
    </div>
  </main>
</div>

<div id="modal-overlay" class="modal-overlay">
  <div class="modal">
    <h2 id="modal-title"></h2>
    <div id="modal-body" class="modal-body"></div>
    <div class="modal-actions">
      <button id="modal-cancel">Cancel</button>
      <button id="modal-confirm" class="primary">Continue</button>
    </div>
  </div>
</div>

<script>
  const startScreenEl = document.getElementById('start-screen');
  const editorScreenEl = document.getElementById('editor-screen');
  const previewEl = document.getElementById('preview');
  const previewEmptyEl = document.getElementById('preview-empty');
  const previewWrapEl = document.querySelector('.preview-wrap');

  // WebView2 (the native window this app actually runs in) frequently
  // doesn't paint a <video>'s first frame until playback has started at
  // least once — it just sits black even though readyState/videoWidth
  // are already correct. A muted play()-then-immediate-pause() forces a
  // real paint without an audible blip or a visible autoplay.
  previewEl.addEventListener('loadeddata', () => {
    const wasMuted = previewEl.muted;
    previewEl.muted = true;
    const playPromise = previewEl.play();
    const restore = () => { previewEl.pause(); previewEl.muted = wasMuted; };
    if (playPromise && typeof playPromise.then === 'function') {
      playPromise.then(restore).catch(() => { previewEl.muted = wasMuted; });
    } else {
      restore();
    }
  });
  const statusEl = document.getElementById('status');
  const timelineRulerEl = document.getElementById('timeline-ruler');
  const trackLaneEls = {
    video: document.getElementById('track-lane-video'),
    audio: document.getElementById('track-lane-audio'),
    text: document.getElementById('track-lane-text'),
  };
  const headerTitleEl = document.getElementById('header-title');
  const cutBtnEl = document.getElementById('cut-btn');
  const transcribeBtnEl = document.getElementById('transcribe-btn');
  const transcriptPanelEl = document.getElementById('transcript-panel');
  const transcriptSearchEl = document.getElementById('transcript-search');
  const transcriptStatusEl = document.getElementById('transcript-status');
  const transcriptListEl = document.getElementById('transcript-list');

  const modalOverlayEl = document.getElementById('modal-overlay');
  const modalTitleEl = document.getElementById('modal-title');
  const modalBodyEl = document.getElementById('modal-body');
  const modalConfirmEl = document.getElementById('modal-confirm');
  const modalCancelEl = document.getElementById('modal-cancel');

  const startInputEl = document.getElementById('start');
  const endInputEl = document.getElementById('end');
  const composerInputEl = document.getElementById('composer-input');
  const composerStatusEl = document.getElementById('composer-status');

  let currentTranscript = [];
  let currentTracks = [];
  let selectedClipId = null;
  let dragState = null;
  const PX_PER_SEC = 30;

  function showScreen(name) {
    startScreenEl.style.display = name === 'start' ? 'flex' : 'none';
    editorScreenEl.style.display = name === 'editor' ? 'flex' : 'none';
  }

  function showModal(title) {
    modalTitleEl.textContent = title;
    modalBodyEl.innerHTML = '';
    modalOverlayEl.style.display = 'flex';
  }

  function hideModal() {
    modalOverlayEl.style.display = 'none';
    modalBodyEl.innerHTML = '';
    modalConfirmEl.style.display = '';
    modalConfirmEl.onclick = null;
  }

  modalCancelEl.addEventListener('click', hideModal);

  function formatTime(seconds) {
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  function timelineDuration(tracks) {
    let maxEnd = 10; // floor so an empty timeline still shows some ruler
    (tracks || []).forEach(t => (t.clips || []).forEach(c => {
      if (c.end_time > maxEnd) maxEnd = c.end_time;
    }));
    return maxEnd + 5;
  }

  function renderRuler(durationSeconds) {
    const widthPx = durationSeconds * PX_PER_SEC;
    timelineRulerEl.style.width = widthPx + 'px';
    timelineRulerEl.innerHTML = '';
    for (let t = 0; t <= durationSeconds; t += 5) {
      const tick = document.createElement('span');
      tick.style.left = (t * PX_PER_SEC) + 'px';
      tick.textContent = formatTime(t);
      timelineRulerEl.appendChild(tick);
    }
  }

  function renderTrackLane(kind, clips, widthPx) {
    const lane = trackLaneEls[kind];
    lane.innerHTML = '';
    lane.style.width = widthPx + 'px';
    (clips || []).forEach(clip => {
      const box = document.createElement('div');
      box.className = 'clip-box ' + kind + (clip.id === selectedClipId ? ' selected' : '');
      box.style.left = (clip.start_time * PX_PER_SEC) + 'px';
      box.style.width = Math.max(clip.duration * PX_PER_SEC, 20) + 'px';
      box.textContent = clip.label || clip.id;
      box.title = `${clip.label || clip.id} (${clip.duration.toFixed(1)}s)`;
      box.addEventListener('mousedown', e => startClipDrag(e, box, clip, kind));
      box.addEventListener('click', e => {
        e.stopPropagation();
        selectedClipId = clip.id;
        renderTracks(currentTracks);
      });
      lane.appendChild(box);
    });
  }

  function renderTracks(tracks) {
    currentTracks = tracks || [];
    const duration = timelineDuration(currentTracks);
    const widthPx = duration * PX_PER_SEC;
    renderRuler(duration);
    ['video', 'audio', 'text'].forEach(kind => {
      const track = currentTracks.find(t => t.kind === kind) || { clips: [] };
      renderTrackLane(kind, track.clips, widthPx);
    });
  }

  function startClipDrag(e, boxEl, clip, kind) {
    e.preventDefault();
    dragState = {
      boxEl, clip, kind,
      startMouseX: e.clientX,
      startLeftPx: clip.start_time * PX_PER_SEC,
      newStartTime: undefined,
    };
    boxEl.classList.add('dragging');
    document.addEventListener('mousemove', onClipDragMove);
    document.addEventListener('mouseup', onClipDragEnd);
  }

  function onClipDragMove(e) {
    if (!dragState) return;
    const deltaPx = e.clientX - dragState.startMouseX;
    const newLeftPx = Math.max(0, dragState.startLeftPx + deltaPx);
    dragState.boxEl.style.left = newLeftPx + 'px';
    dragState.newStartTime = newLeftPx / PX_PER_SEC;
  }

  async function onClipDragEnd() {
    document.removeEventListener('mousemove', onClipDragMove);
    document.removeEventListener('mouseup', onClipDragEnd);
    const state = dragState;
    dragState = null;
    if (!state) return;
    state.boxEl.classList.remove('dragging');
    if (state.newStartTime === undefined || Math.abs(state.newStartTime - state.clip.start_time) < 0.01) {
      return; // no meaningful move — leave as-is, no need to round-trip to the backend
    }
    const result = await window.pywebview.api.move_clip(state.kind, state.clip.id, state.newStartTime);
    if (result.error) { alert(result.error); }
    refreshTracks();
  }

  Object.values(trackLaneEls).forEach(lane => {
    lane.addEventListener('click', () => {
      selectedClipId = null;
      renderTracks(currentTracks);
    });
  });

  // The transcript/search panel replaces the video preview in the same
  // slot (chosen over adding a separate panel below the tool rail, to
  // keep the top row compact) — toggled by the Transcribe icon.
  function showPreviewPane(which) {
    previewWrapEl.style.display = which === 'video' ? 'flex' : 'none';
    transcriptPanelEl.style.display = which === 'transcript' ? 'flex' : 'none';
  }

  function renderTranscript(segments) {
    transcriptListEl.innerHTML = '';
    (segments || []).forEach(seg => {
      const row = document.createElement('div');
      row.className = 'transcript-row';
      const ts = document.createElement('span');
      ts.className = 'ts';
      ts.textContent = formatTime(seg.start);
      row.appendChild(ts);
      row.appendChild(document.createTextNode(seg.text));
      row.addEventListener('click', () => {
        previewEl.currentTime = seg.start;
      });
      transcriptListEl.appendChild(row);
    });
  }

  function hydrateProject(result) {
    if (!result) return;
    if (result.path) {
      previewEl.src = result.path; // already a served http://127.0.0.1:<port>/media?... URL
      previewEmptyEl.style.display = 'none';
    } else {
      previewEl.removeAttribute('src');
      previewEl.load();
      previewEmptyEl.style.display = 'flex';
    }

    // The Start/End trim inputs used to default to a fixed 0-5 regardless
    // of the actual video — confusing for anything shorter/longer than
    // 5s. Tie them to the real source duration instead: End defaults to
    // the full length (so a bare "Cut" with no adjustment cuts the whole
    // clip), and both inputs are capped so you can't type past the end.
    const duration = result.info && result.info.duration_seconds;
    if (duration) {
      startInputEl.max = duration;
      endInputEl.max = duration;
      startInputEl.value = 0;
      endInputEl.value = duration;
    } else {
      startInputEl.removeAttribute('max');
      endInputEl.removeAttribute('max');
    }

    const project = result.project || {};
    headerTitleEl.textContent = project.name || 'Scenecraft';
    selectedClipId = null;
    renderTracks(project.tracks);

    currentTranscript = project.transcript || [];
    transcriptSearchEl.value = '';
    showPreviewPane('video'); // always land on the video, even if a transcript already exists
    if (currentTranscript.length) {
      transcriptStatusEl.textContent = `${currentTranscript.length} segments`;
      renderTranscript(currentTranscript);
      transcribeBtnEl.classList.add('active');
    } else {
      transcriptStatusEl.textContent = '';
      transcriptListEl.innerHTML = '';
      transcribeBtnEl.classList.remove('active');
    }

    statusEl.textContent = '';
    showScreen('editor');
  }

  async function newProjectFlow() {
    // No dialog, no prompt — straight into an empty editor. The project
    // name is auto-generated behind the scenes purely so there's a
    // project.json to write to; the user can rename it later by clicking
    // the name in the header.
    const result = await window.pywebview.api.new_project();
    if (result.error) { alert(result.error); return; }
    hydrateProject(result);
  }

  async function importVideo() {
    statusEl.textContent = 'Importing…';
    const result = await window.pywebview.api.import_video();
    if (!result) { statusEl.textContent = ''; return; } // user cancelled the file dialog
    if (result.error) { statusEl.textContent = 'Import error: ' + result.error; return; }
    hydrateProject(result);
    statusEl.textContent = '';
  }

  function startRenameProject() {
    const currentName = headerTitleEl.textContent;
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'header-title-input';
    input.value = currentName;
    headerTitleEl.replaceWith(input);
    input.focus();
    input.select();

    let committed = false;
    const commit = async () => {
      if (committed) return;
      committed = true;
      const newName = input.value.trim();
      input.replaceWith(headerTitleEl);
      if (!newName || newName === currentName) return;
      const result = await window.pywebview.api.rename_project(newName);
      if (result.error) { alert(result.error); return; }
      headerTitleEl.textContent = result.name;
    };
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') input.blur();
      if (e.key === 'Escape') { input.value = currentName; input.blur(); }
    });
    input.addEventListener('blur', commit);
  }

  async function openProjectFlow() {
    const projects = await window.pywebview.api.list_projects();
    showModal('Open project');
    modalConfirmEl.style.display = 'none';

    if (!projects.length) {
      const p = document.createElement('p');
      p.style.color = 'var(--text-muted)';
      p.textContent = 'No saved projects found in ~/Scenecraft.';
      modalBodyEl.appendChild(p);
      return;
    }

    const list = document.createElement('div');
    list.className = 'project-list';
    projects.forEach(proj => {
      const row = document.createElement('div');
      row.className = 'project-row';
      row.textContent = proj.name;
      row.addEventListener('click', async () => {
        hideModal();
        const result = await window.pywebview.api.open_project(proj.path);
        if (result.error) { alert(result.error); return; }
        hydrateProject(result);
      });
      list.appendChild(row);
    });
    modalBodyEl.appendChild(list);
  }

  async function cutScene() {
    const start = parseFloat(document.getElementById('start').value);
    const end = parseFloat(document.getElementById('end').value);
    statusEl.textContent = 'Cutting…';
    const result = await window.pywebview.api.cut_scene(start, end);
    if (result.error) {
      statusEl.textContent = 'Error: ' + result.error;
      return;
    }
    statusEl.textContent = 'Saved ' + result.scene_id;
    refreshTracks();
  }

  async function refreshTracks() {
    const tracks = await window.pywebview.api.get_tracks();
    renderTracks(tracks);
  }

  async function toggleTranscribe() {
    const showingTranscript = transcriptPanelEl.style.display === 'flex';
    if (showingTranscript) {
      showPreviewPane('video'); // clicking again while open switches back to the video
      return;
    }
    showPreviewPane('transcript');
    if (currentTranscript.length > 0) {
      return; // already transcribed — just showing the panel, no need to re-run
    }

    transcribeBtnEl.disabled = true;
    transcriptStatusEl.textContent = 'Transcribing… this can take a while.';
    transcriptListEl.innerHTML = '';
    const result = await window.pywebview.api.transcribe();
    transcribeBtnEl.disabled = false;
    if (result.error) {
      transcriptStatusEl.textContent = 'Error: ' + result.error;
      return;
    }
    currentTranscript = result.transcript;
    transcriptStatusEl.textContent = `${currentTranscript.length} segments`;
    renderTranscript(currentTranscript);
    transcribeBtnEl.classList.add('active');
  }

  transcriptSearchEl.addEventListener('input', async e => {
    const results = await window.pywebview.api.search_transcript(e.target.value);
    renderTranscript(results);
  });

  async function openSettingsFlow() {
    const settings = await window.pywebview.api.get_settings();
    showModal('Settings');

    const label = document.createElement('label');
    label.style.fontSize = '12px';
    label.style.color = 'var(--text-muted)';
    label.textContent = 'API key (stored locally only — nothing in the app sends this anywhere yet; this is a slot for an AI-assisted mode that isn’t built yet)';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = 'sk-...';
    input.value = settings.api_key || '';
    input.style.marginTop = '8px';
    modalBodyEl.appendChild(label);
    modalBodyEl.appendChild(input);
    setTimeout(() => input.focus(), 0);

    modalConfirmEl.textContent = 'Save';
    modalConfirmEl.onclick = async () => {
      await window.pywebview.api.set_api_key(input.value);
      hideModal();
      modalConfirmEl.textContent = 'Continue';
    };
  }

  async function runComposerCommand() {
    const text = composerInputEl.value.trim();
    if (!text) return;
    composerInputEl.value = '';
    composerStatusEl.textContent = 'Working…';

    const response = await window.pywebview.api.run_command(text, previewEl.currentTime || 0);
    if (!response) return;
    composerStatusEl.textContent = response.message || response.error || '';

    if (response.error) return; // unrecognized or failed — nothing else changed

    if (response.action === 'import' && response.result && response.result.path) {
      hydrateProject(response.result);
      return;
    }
    if (response.action === 'transcribe' && response.result && response.result.transcript) {
      currentTranscript = response.result.transcript;
      transcriptStatusEl.textContent = `${currentTranscript.length} segments`;
      renderTranscript(currentTranscript);
      transcribeBtnEl.classList.add('active');
      showPreviewPane('transcript');
    }
    if (response.action === 'search' && response.result) {
      renderTranscript(response.result.matches);
      transcriptSearchEl.value = response.result.query;
      showPreviewPane('transcript');
    }
    refreshTracks();
  }

  async function goBack() {
    const leave = confirm('Leave this project and go back? Your work is saved automatically.');
    if (!leave) return;
    await window.pywebview.api.save_project();
    showScreen('start');
  }

  document.getElementById('back-btn').addEventListener('click', goBack);
  document.getElementById('new-project-btn').addEventListener('click', newProjectFlow);
  document.getElementById('open-project-btn').addEventListener('click', openProjectFlow);
  headerTitleEl.addEventListener('click', startRenameProject);
  document.getElementById('import-btn').addEventListener('click', importVideo);
  document.getElementById('audio-btn').addEventListener('click', async () => {
    statusEl.textContent = 'Adding audio…';
    const result = await window.pywebview.api.add_audio_clip();
    if (!result) { statusEl.textContent = ''; return; } // cancelled
    if (result.error) { statusEl.textContent = 'Error: ' + result.error; return; }
    statusEl.textContent = 'Added audio clip.';
    refreshTracks();
  });
  document.getElementById('text-btn').addEventListener('click', () => {
    statusEl.textContent = 'Adding text clips is coming soon.';
  });
  document.getElementById('cut-btn').addEventListener('click', cutScene);
  document.getElementById('transcribe-btn').addEventListener('click', toggleTranscribe);
  document.getElementById('settings-btn').addEventListener('click', openSettingsFlow);
  document.getElementById('composer-send').addEventListener('click', runComposerCommand);
  composerInputEl.addEventListener('keydown', e => { if (e.key === 'Enter') runComposerCommand(); });
  document.getElementById('export-btn').addEventListener('click', async () => {
    statusEl.textContent = 'Exporting…';
    const result = await window.pywebview.api.export_project();
    if (!result) { statusEl.textContent = ''; return; } // user cancelled the save dialog
    if (result.error) {
      statusEl.textContent = 'Export error: ' + result.error;
      return;
    }
    statusEl.textContent = 'Exported to ' + result.path;
  });

  showScreen('start');
</script>

</body>
</html>
