<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Scenecraft</title>
<style>
  :root {
    --bg: #121212;
    --panel: #1c1c1c;
    --panel-raised: #232323;
    --border: #2c2c2c;
    --text: #e8e8e6;
    --text-muted: #8a8a86;
    --accent: #7f77dd;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", sans-serif;
    /* The app is a fixed-height desktop window; nothing should ever scroll
       the page itself. Panels that need scrolling do it internally. */
    overflow: hidden;
  }

  /* Default OS scrollbars are fat and light — jarring against this UI. */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #4a4a4a; }
  ::-webkit-scrollbar-corner { background: transparent; }
  button {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 14px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #121212; border: none; }

  .screen { height: 100vh; display: flex; flex-direction: column; }

  /* ---------- Screen 1: start ---------- */
  .start-screen {
    align-items: center;
    justify-content: center;
  }
  .start-buttons { display: flex; gap: 16px; }
  .start-buttons button.large {
    padding: 14px 28px;
    font-size: 14px;
    border-radius: 8px;
  }

  /* ---------- Screen 2: editor ---------- */
  header {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex: 0 0 auto;
  }
  header h1 { font-size: 15px; font-weight: 500; margin: 0; }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .header-center { flex: 1; display: flex; justify-content: center; }
  #back-btn { width: 30px; height: 30px; padding: 0; display: flex; align-items: center; justify-content: center; border-radius: 6px; }
  #back-btn svg { width: 16px; height: 16px; }
  #header-title { cursor: pointer; border-radius: 4px; padding: 2px 6px; margin: 0 -6px; }
  #header-title:hover { background: var(--panel); }
  .header-title-input {
    font-size: 15px; font-weight: 500; font-family: inherit; background: var(--panel);
    border: 1px solid var(--accent); color: var(--text); border-radius: 4px; padding: 2px 6px;
  }

  /* CapCut-style manual/AI mode pill switch, centered in the header */
  .mode-toggle {
    display: flex; background: var(--panel); border: 1px solid var(--border);
    border-radius: 20px; padding: 3px; gap: 2px;
  }
  .mode-toggle-btn {
    border: none; background: transparent; color: var(--text-muted);
    padding: 6px 16px; border-radius: 16px; font-size: 12px; font-weight: 500;
    cursor: pointer; transition: background 0.15s, color 0.15s;
  }
  .mode-toggle-btn:hover { border-color: transparent; color: var(--text); }
  .mode-toggle-btn.active { background: var(--accent); color: #121212; }

  .model-indicator {
    display: flex; align-items: center; gap: 6px; padding: 6px 12px;
    border-radius: 14px; font-size: 11px; color: var(--text-muted);
  }
  .model-indicator-dot { width: 7px; height: 7px; border-radius: 50%; background: #6fcf7a; flex: 0 0 auto; }
  .model-indicator-dot.offline { background: #8a8a86; }

  .editor-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 12px;
    gap: 10px;
    overflow: hidden;
    min-height: 0;
  }

  /* ---- CapCut-style workspace: assets | stage | inspector ---- */
  .workspace { display: flex; gap: 10px; flex: 1; min-height: 0; overflow: hidden; }

  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; display: flex; flex-direction: column;
    min-height: 0; min-width: 0;
  }
  .panel-head {
    flex: 0 0 auto; padding: 10px 12px; font-size: 10.5px; font-weight: 600;
    letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-muted);
    border-bottom: 1px solid var(--border);
  }
  .panel-body { flex: 1; min-height: 0; overflow-y: auto; padding: 8px; }

  .panel-assets { flex: 0 0 172px; }
  .asset-btn {
    display: flex; align-items: center; gap: 10px; width: 100%; margin-bottom: 2px;
    background: transparent; border: 1px solid transparent; color: var(--text);
    padding: 9px 10px; border-radius: 8px; font-size: 12.5px; text-align: left;
  }
  .asset-btn:hover { background: var(--panel-raised); border-color: var(--border); }
  .asset-btn.active { color: var(--accent); border-color: var(--accent); }
  .asset-btn svg { width: 16px; height: 16px; flex: 0 0 auto; }

  .stage { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .preview-area { flex: 1; min-width: 0; min-height: 0; position: relative; display: flex; }

  /* Custom transport — the browser's default video control bar looked
     nothing like the rest of the app, so the player is chrome-less and
     driven by this instead. */
  .transport {
    flex: 0 0 auto; display: flex; align-items: center; gap: 12px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 14px;
  }
  .transport-btn {
    width: 30px; height: 30px; padding: 0; border-radius: 50%; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    background: var(--panel-raised); border: 1px solid var(--border);
  }
  .transport-btn svg { width: 13px; height: 13px; }
  #play-btn { background: var(--accent); border-color: transparent; color: #121212; }
  .transport-time {
    font-size: 11.5px; color: var(--text-muted); flex: 0 0 auto;
    font-variant-numeric: tabular-nums;
  }
  .transport-track {
    flex: 1; height: 4px; border-radius: 2px; background: var(--border);
    position: relative; cursor: pointer;
  }
  .transport-track::before { content: ''; position: absolute; inset: -8px 0; }
  .transport-fill {
    position: absolute; top: 0; bottom: 0; left: 0; width: 0;
    background: var(--accent); border-radius: 2px;
  }

  .panel-inspector { flex: 0 0 208px; }
  .inspector-empty { color: var(--text-muted); font-size: 12px; padding: 8px 4px; line-height: 1.5; }
  .inspector-meta { font-size: 11.5px; color: var(--text-muted); line-height: 1.6; margin-bottom: 14px; }
  .inspector-meta strong { color: var(--text); font-weight: 500; display: block; font-size: 12.5px; margin-bottom: 3px; }
  .inspector-field { margin-bottom: 12px; }
  .inspector-field > label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 5px; }
  /* Steppers rather than range sliders: exact, clickable, and they match
     the discrete nudges the composer's effect commands already apply. */
  .stepper { display: flex; align-items: center; gap: 6px; }
  .stepper button {
    width: 26px; height: 26px; padding: 0; border-radius: 6px; font-size: 15px; line-height: 1;
    display: flex; align-items: center; justify-content: center; flex: 0 0 auto;
  }
  .stepper .stepper-value {
    flex: 1; text-align: center; font-size: 12px; font-variant-numeric: tabular-nums;
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 4px 0;
  }

  /* ---- Director mode: a conversation, not an editor ---- */
  .chat-panel { flex: 0 1 40%; min-width: 0; display: none; }
  .chat-body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; padding: 10px; }
  .chat-suggestions { display: flex; flex-wrap: wrap; gap: 6px; flex: 0 0 auto; }
  .chip {
    font-size: 11.5px; padding: 5px 11px; border-radius: 14px;
    background: var(--panel-raised); border: 1px solid var(--border); color: var(--text-muted);
  }
  .chip:hover { color: var(--text); border-color: var(--accent); }

  .editor-main.director-mode .panel-assets,
  .editor-main.director-mode .panel-inspector,
  .editor-main.director-mode .timeline-toolbar { display: none; }
  .editor-main.director-mode .chat-panel { display: flex; }

  /* Narrow windows used to push the fixed-width side panels past the edge,
     which is what put scrollbars on the whole page. Drop the optional
     panels instead of letting the layout overflow. */
  @media (max-width: 1000px) {
    .panel-inspector { display: none; }
  }
  @media (max-width: 780px) {
    .panel-assets { display: none; }
    .chat-panel { flex: 1 1 auto; }
  }

  .preview-wrap { position: relative; flex: 1; min-height: 0; background: #000; border-radius: 8px; overflow: hidden; }
  .preview-wrap video { width: 100%; height: 100%; object-fit: contain; }
  .preview-empty {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--text-muted); font-size: 13px; pointer-events: none;
  }
  .caption-overlay {
    position: absolute; left: 0; right: 0; bottom: 12%; display: flex; justify-content: center;
    pointer-events: none; padding: 0 24px;
  }
  .caption-overlay span {
    background: rgba(0,0,0,0.65); color: #fff; padding: 6px 14px; border-radius: 4px;
    font-size: 18px; line-height: 1.35; text-align: center; max-width: 100%; white-space: pre-wrap;
  }

  .timeline-section { display: flex; flex-direction: column; gap: 8px; flex: 0 0 auto; }
  .timeline-toolbar { display: flex; gap: 8px; align-items: center; flex: 0 0 auto; }
  .tool-btn { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 7px; font-size: 12px; }
  .tool-btn svg { width: 13px; height: 13px; }
  .range-readout {
    font-size: 11.5px; color: var(--text-muted); font-variant-numeric: tabular-nums;
    background: var(--panel); border: 1px solid var(--border); border-radius: 7px; padding: 6px 11px;
  }
  .toolbar-sep { width: 1px; height: 20px; background: var(--border); flex: 0 0 auto; }

  /* Composer: local, offline pattern-matched edit commands */
  .composer-input-wrap {
    display: flex; align-items: center; gap: 8px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 24px;
    padding: 4px 4px 4px 16px; transition: border-color 0.15s;
  }
  .composer-input-wrap:focus-within { border-color: var(--accent); }
  #composer-input {
    flex: 1; background: transparent; border: none; color: var(--text);
    font-size: 13px; padding: 8px 0; outline: none;
  }
  .composer-send-btn {
    flex: 0 0 auto; width: 34px; height: 34px; padding: 0; border-radius: 50%;
    background: var(--accent); border: none; color: #121212;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    transition: opacity 0.15s; margin: 0;
  }
  .composer-send-btn:hover { opacity: 0.82; border-color: transparent; }
  .composer-send-btn svg { width: 15px; height: 15px; transform: translateX(-1px); }

  .composer-log {
    display: flex; flex-direction: column; gap: 6px;
    flex: 1; min-height: 0; overflow-y: auto;
    padding: 2px 4px;
  }
  .composer-msg {
    max-width: 82%; padding: 8px 13px; border-radius: 15px; font-size: 13px;
    line-height: 1.42; white-space: pre-wrap; word-break: break-word;
  }
  .composer-msg.user {
    align-self: flex-end; background: var(--accent); color: #121212;
    border-bottom-right-radius: 4px;
  }
  .composer-msg.ai {
    align-self: flex-start; background: var(--panel-raised); border: 1px solid var(--border);
    color: var(--text); border-bottom-left-radius: 4px;
  }
  .composer-msg.ai.pending { color: var(--text-muted); font-style: italic; }
  .composer-msg.ai.error { border-color: #b5544f; color: #e8b4b0; }

  #settings-btn { width: 30px; height: 30px; padding: 0; display: flex; align-items: center; justify-content: center; border-radius: 6px; }
  #settings-btn svg { width: 16px; height: 16px; }
  .header-right { display: flex; gap: 8px; align-items: center; }
  #aspect-ratio-select {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 6px 10px; font-size: 12px;
  }

  .timeline-scroll {
    position: relative;
    /* overflow-y was hidden, which silently clipped any clip that got
       stacked onto a second row — cap the height and scroll instead */
    overflow-x: auto; overflow-y: auto; max-height: 30vh;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--panel);
  }
  .timeline-ruler { height: 20px; position: relative; border-bottom: 1px solid var(--border); cursor: pointer; }
  .timeline-ruler span {
    position: absolute; top: 3px; font-size: 10px; color: var(--text-muted); white-space: nowrap;
  }
  .timeline-playhead {
    position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent);
    z-index: 5; cursor: ew-resize; pointer-events: auto;
  }
  .timeline-playhead::before {
    content: ''; position: absolute; top: -1px; left: -4px; width: 10px; height: 10px;
    background: var(--accent); border-radius: 2px;
  }
  /* One timeline. Clips of every kind share it and only stack when they
     genuinely overlap in time, so there are no permanent empty lanes. */
  .timeline-lane { position: relative; min-height: 44px; }
  .clip-box {
    position: absolute; height: 32px; border-radius: 5px; padding: 5px 7px;
    font-size: 11px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    cursor: grab; border: 1px solid transparent; user-select: none;
    display: flex; align-items: center; gap: 5px;
  }
  .clip-box .clip-kind { opacity: 0.75; flex: 0 0 auto; display: flex; }
  .clip-box .clip-kind svg { width: 11px; height: 11px; }
  .clip-box.video { background: #4c4a8a; color: var(--text); }
  .clip-box.audio { background: #3d6b5c; color: var(--text); }
  .clip-box.text { background: #7a5a3d; color: var(--text); }
  .clip-box.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .clip-box.dragging { opacity: 0.8; cursor: grabbing; }

  .icon-btn {
    width: 36px; height: 36px; padding: 0; display: flex; align-items: center; justify-content: center;
    border-radius: 8px;
  }
  .icon-btn svg { width: 18px; height: 18px; }
  .icon-btn.active { border-color: var(--accent); color: var(--accent); }
  .status-text { color: var(--text-muted); font-size: 12px; margin-left: 4px; }

  /* Transcript panel fills the same slot the preview normally occupies */
  .transcript-panel {
    flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px;
    background: var(--panel-raised); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px; overflow: hidden;
  }
  .transcript-panel-header { display: flex; justify-content: space-between; align-items: center; font-size: 12px; flex: 0 0 auto; }
  .transcript-panel-header strong { color: var(--text); }
  #transcript-search {
    flex: 0 0 auto; background: var(--bg); border: 1px solid var(--border);
    color: var(--text); border-radius: 4px; padding: 6px 8px; font-size: 12px;
  }
  .transcript-list { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
  .transcript-row { padding: 6px 8px; border-radius: 4px; cursor: pointer; line-height: 1.4; font-size: 12px; }
  .transcript-row:hover { background: var(--bg); }
  .transcript-row .ts { color: var(--accent); margin-right: 6px; font-variant-numeric: tabular-nums; }

  /* ---------- Modal (shared) ---------- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    display: none; align-items: center; justify-content: center; z-index: 10;
  }
  .modal {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 20px; width: 340px; max-width: 90vw; max-height: 70vh; display: flex;
    flex-direction: column; gap: 12px;
  }
  .modal h2 { margin: 0; font-size: 14px; font-weight: 500; }
  .modal input[type="text"] {
    width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 8px 10px; font-size: 13px;
  }
  .modal textarea {
    width: 100%; min-height: 220px; background: var(--bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 8px 10px; font-size: 13px; font-family: inherit; resize: vertical;
  }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .modal-body { overflow-y: auto; }
  .project-list { display: flex; flex-direction: column; gap: 4px; max-height: 40vh; overflow-y: auto; }
  .project-row {
    padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  .project-row:hover { border-color: var(--accent); }

  /* ---------- Screen 3: guided recording ---------- */
  .recording-main {
    flex: 1; display: flex; flex-direction: column; padding: 16px 20px; gap: 16px;
    overflow: hidden; min-height: 0;
  }
  .recording-camera-wrap {
    position: relative; flex: 1; min-height: 0; background: #000; border-radius: 8px; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .recording-camera-wrap video { width: 100%; height: 100%; object-fit: cover; }
  .recording-indicator {
    position: absolute; top: 12px; left: 12px; background: rgba(220,60,60,0.9); color: #fff;
    padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: 600; letter-spacing: 0.02em;
  }
  .teleprompter {
    flex: 0 0 auto; background: var(--panel-raised); border: 1px solid var(--border); border-radius: 8px;
    padding: 18px 24px; text-align: center;
  }
  .teleprompter-scene-label { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; }
  .teleprompter-direction { font-size: 13px; color: var(--accent); font-style: italic; margin-bottom: 10px; }
  .teleprompter-text { font-size: 22px; line-height: 1.45; }
  .recording-controls { flex: 0 0 auto; display: flex; justify-content: center; align-items: center; gap: 10px; }
</style>
</head>
<body>

<div id="start-screen" class="screen start-screen">
  <div class="start-buttons">
    <button id="new-project-btn" class="primary large">New project</button>
    <button id="open-project-btn" class="large">Open project</button>
  </div>
</div>

<div id="editor-screen" class="screen editor-screen" style="display:none;">
  <header>
    <div class="header-left">
      <button id="back-btn" title="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </button>
      <h1 id="header-title">Scenecraft</h1>
    </div>
    <div class="header-center">
      <div class="mode-toggle" role="group" aria-label="Edit mode">
        <button id="mode-manual-btn" class="mode-toggle-btn active" data-mode="manual">Manual</button>
        <button id="mode-ai-btn" class="mode-toggle-btn" data-mode="director">Director</button>
      </div>
    </div>
    <div class="header-right">
      <button id="model-indicator-btn" class="model-indicator" title="Local AI model — click to change">
        <span id="model-indicator-dot" class="model-indicator-dot"></span>
        <span id="model-indicator-label">Local AI</span>
      </button>
      <select id="aspect-ratio-select" title="Export frame size">
        <option value="auto">Auto (source)</option>
        <option value="16:9">16:9 landscape</option>
        <option value="9:16">9:16 portrait</option>
        <option value="1:1">1:1 square</option>
        <option value="4:5">4:5 portrait</option>
        <option value="4:3">4:3 landscape</option>
      </select>
      <button id="settings-btn" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82A1.65 1.65 0 0 0 3 13.09H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
      <button id="export-btn" class="primary">Export</button>
    </div>
  </header>

  <main class="editor-main">
    <div class="workspace">
      <aside class="panel panel-assets">
        <div class="panel-head">Media</div>
        <div class="panel-body">
          <button id="import-btn" class="asset-btn" title="Import video">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="17 8 12 3 7 8"></polyline>
              <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
            Import video
          </button>
          <button id="script-btn" class="asset-btn" title="Script &amp; guided recording">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="23 7 16 12 23 17 23 7"></polygon>
              <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
            </svg>
            Script &amp; record
          </button>
          <button id="audio-btn" class="asset-btn" title="Add audio (coming soon)">

      <button id="modal-confirm" class="primary">Continue</button>

<script>
  const startScreenEl = document.getElementById('start-screen');
  const editorScreenEl = document.getElementById('editor-screen');
  const previewEl = document.getElementById('preview');
  const previewEmptyEl = document.getElementById('preview-empty');
  const previewWrapEl = document.querySelector('.preview-wrap');
  const captionOverlayEl = document.getElementById('caption-overlay');

  // WebView2 (the native window this app actually runs in) frequently
  // doesn't paint a <video>'s first frame until playback has started at
  // least once — it just sits black even though readyState/videoWidth
  // are already correct. A muted play()-then-immediate-pause() forces a
  // real paint without an audible blip or a visible autoplay.
  previewEl.addEventListener('loadeddata', () => {
    const wasMuted = previewEl.muted;
    previewEl.muted = true;
    const playPromise = previewEl.play();
    const restore = () => { previewEl.pause(); previewEl.muted = wasMuted; };
    if (playPromise && typeof playPromise.then === 'function') {
      playPromise.then(restore).catch(() => { previewEl.muted = wasMuted; });
    } else {
      restore();
    }
  });

  // Captions/text-track clips previously only showed up once you
  // exported — the live preview just played the raw video with nothing
  // overlaid. This mirrors that onto the preview itself: whichever
  // text-track clip covers the current playhead gets shown, the same
  // way it'll actually look burned in at export.
  function updateCaptionOverlay() {
    const textTrack = (currentTracks || []).find(t => t.kind === 'text');
    const clips = textTrack ? textTrack.clips : [];
    const t = previewEl.currentTime;
    const active = clips.find(c => t >= c.start_time && t < c.end_time && c.label);
    captionOverlayEl.innerHTML = '';
    if (active) {
      const span = document.createElement('span');
      span.textContent = active.label;
      captionOverlayEl.appendChild(span);
    }
  }
  // (caption overlay, playhead and transport all update from the single
  // consolidated timeupdate/seeked handler further down)
  const statusEl = document.getElementById('status');
  const timelineRulerEl = document.getElementById('timeline-ruler');
  const timelineScrollEl = document.querySelector('.timeline-scroll');
  const timelinePlayheadEl = document.getElementById('timeline-playhead');
  const timelineLaneEl = document.getElementById('timeline-lane');
  const headerTitleEl = document.getElementById('header-title');
  const cutBtnEl = document.getElementById('cut-btn');
  const transcribeBtnEl = document.getElementById('transcribe-btn');
  const transcriptPanelEl = document.getElementById('transcript-panel');
  const transcriptSearchEl = document.getElementById('transcript-search');
  const transcriptStatusEl = document.getElementById('transcript-status');
  const transcriptListEl = document.getElementById('transcript-list');

  const modalOverlayEl = document.getElementById('modal-overlay');
  const modalTitleEl = document.getElementById('modal-title');
  const modalBodyEl = document.getElementById('modal-body');
  const modalConfirmEl = document.getElementById('modal-confirm');
  const modalCancelEl = document.getElementById('modal-cancel');

  const markInBtnEl = document.getElementById('mark-in-btn');
  const markOutBtnEl = document.getElementById('mark-out-btn');
  const rangeReadoutEl = document.getElementById('range-readout');
  const inspectorBodyEl = document.getElementById('inspector-body');
  const chatSuggestionsEl = document.getElementById('chat-suggestions');
  const playBtnEl = document.getElementById('play-btn');
  const playIconEl = document.getElementById('play-icon');
  const pauseIconEl = document.getElementById('pause-icon');
  const transportCurrentEl = document.getElementById('transport-current');
  const transportDurationEl = document.getElementById('transport-duration');
  const transportTrackEl = document.getElementById('transport-track');
  const transportFillEl = document.getElementById('transport-fill');
  const composerInputEl = document.getElementById('composer-input');
  const composerLogEl = document.getElementById('composer-log');

  function addComposerMessage(role, text, opts) {
    const el = document.createElement('div');
    el.className = `composer-msg ${role}` + (opts && opts.pending ? ' pending' : '') + (opts && opts.error ? ' error' : '');
    el.textContent = text;
    composerLogEl.appendChild(el);
    composerLogEl.scrollTop = composerLogEl.scrollHeight;
    return el;
  }
  const aspectRatioSelectEl = document.getElementById('aspect-ratio-select');
  const editorMainEl = document.querySelector('.editor-main');
  const modeManualBtnEl = document.getElementById('mode-manual-btn');
  const modeAiBtnEl = document.getElementById('mode-ai-btn');
  const modelIndicatorBtnEl = document.getElementById('model-indicator-btn');
  const modelIndicatorDotEl = document.getElementById('model-indicator-dot');
  const modelIndicatorLabelEl = document.getElementById('model-indicator-label');

  let currentTranscript = [];
  let currentTracks = [];
  let currentScript = [];
  let selectedClipId = null;
  let dragState = null;
  const PX_PER_SEC = 30;

  const recordingScreenEl = document.getElementById('recording-screen');
  const cameraPreviewEl = document.getElementById('camera-preview');
  const recordingIndicatorEl = document.getElementById('recording-indicator');
  const sceneNumberEl = document.getElementById('scene-number');
  const sceneTotalEl = document.getElementById('scene-total');
  const teleprompterTextEl = document.getElementById('teleprompter-text');
  const teleprompterDirectionEl = document.getElementById('teleprompter-direction');
  const recordingProgressEl = document.getElementById('recording-progress');
  const recordBtnEl = document.getElementById('record-btn');
  const stopBtnEl = document.getElementById('stop-btn');
  const retakeBtnEl = document.getElementById('retake-btn');
  const useTakeBtnEl = document.getElementById('use-take-btn');

  let cameraStream = null;
  let mediaRecorder = null;
  let recordedChunks = [];
  let pendingTakeBlob = null;
  let currentSceneIndex = 0;

  function showScreen(name) {
    startScreenEl.style.display = name === 'start' ? 'flex' : 'none';
    editorScreenEl.style.display = name === 'editor' ? 'flex' : 'none';
    recordingScreenEl.style.display = name === 'recording' ? 'flex' : 'none';
  }

  function showModal(title) {
    modalTitleEl.textContent = title;
    modalBodyEl.innerHTML = '';
    modalOverlayEl.style.display = 'flex';
  }

  function hideModal() {
    modalOverlayEl.style.display = 'none';
    modalBodyEl.innerHTML = '';
    modalConfirmEl.style.display = '';
    modalConfirmEl.onclick = null;
  }

  modalCancelEl.addEventListener('click', hideModal);

  function formatTime(seconds) {
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  function timelineDuration(tracks) {
    let maxEnd = 10; // floor so an empty timeline still shows some ruler
    (tracks || []).forEach(t => (t.clips || []).forEach(c => {
      if (c.end_time > maxEnd) maxEnd = c.end_time;
    }));
    return maxEnd + 5;
  }

  function renderRuler(durationSeconds) {
    const widthPx = durationSeconds * PX_PER_SEC;
    timelineRulerEl.style.width = widthPx + 'px';
    timelineRulerEl.innerHTML = '';
    for (let t = 0; t <= durationSeconds; t += 5) {
      const tick = document.createElement('span');
      tick.style.left = (t * PX_PER_SEC) + 'px';
      tick.textContent = formatTime(t);
      timelineRulerEl.appendChild(tick);
    }
  }

  // ---- timeline playhead: synced to the video, click/drag to scrub ----
  // No track-label gutter any more, so timeline x maps straight to time.
  function updatePlayheadPosition() {
    const t = previewEl.currentTime || 0;
    timelinePlayheadEl.style.left = (t * PX_PER_SEC) + 'px';
  }
  // ---- custom transport (the native <video controls> bar is gone) ----
  function updateTransport() {
    const t = previewEl.currentTime || 0;
    const d = previewEl.duration;
    transportCurrentEl.textContent = formatTime(t);
    if (d && isFinite(d)) {
      transportDurationEl.textContent = formatTime(d);
      transportFillEl.style.width = Math.min(100, (t / d) * 100) + '%';
    } else {
      transportDurationEl.textContent = '0:00';
      transportFillEl.style.width = '0%';
    }
  }

  // One handler for all three time-driven UI bits rather than three
  // separate listeners doing three separate layout passes per tick.
  function onPlaybackTick() {
    updatePlayheadPosition();
    updateCaptionOverlay();
    updateTransport();
  }
  previewEl.addEventListener('timeupdate', onPlaybackTick);
  previewEl.addEventListener('seeked', onPlaybackTick);
  previewEl.addEventListener('loadedmetadata', onPlaybackTick);

  function setPlayIcon(playing) {
    playIconEl.style.display = playing ? 'none' : '';
    pauseIconEl.style.display = playing ? '' : 'none';
  }
  previewEl.addEventListener('play', () => setPlayIcon(true));
  previewEl.addEventListener('pause', () => setPlayIcon(false));
  playBtnEl.addEventListener('click', () => {
    if (previewEl.paused) previewEl.play(); else previewEl.pause();
  });
  transportTrackEl.addEventListener('click', e => {
    const d = previewEl.duration;
    if (!d || !isFinite(d)) return;
    const rect = transportTrackEl.getBoundingClientRect();
    previewEl.currentTime = Math.max(0, Math.min(d, ((e.clientX - rect.left) / rect.width) * d));
  });
  document.getElementById('mute-btn').addEventListener('click', e => {
    previewEl.muted = !previewEl.muted;
    e.currentTarget.style.opacity = previewEl.muted ? '0.45' : '';
  });
  document.getElementById('fullscreen-btn').addEventListener('click', () => {
    if (previewEl.requestFullscreen) previewEl.requestFullscreen();
  });

  function seekFromContentX(contentX) {
    previewEl.currentTime = Math.max(0, contentX / PX_PER_SEC);
  }

  timelineRulerEl.addEventListener('click', e => {
    const rect = timelineScrollEl.getBoundingClientRect();
    seekFromContentX(e.clientX - rect.left + timelineScrollEl.scrollLeft);
  });

  let playheadDragging = false;
  timelinePlayheadEl.addEventListener('mousedown', e => {
    playheadDragging = true;
    e.preventDefault();
  });
  // mousemove fires far faster than the video can actually seek, and every
  // currentTime write triggers a seek + repaint — coalesce to one per frame.
  let pendingSeekX = null;
  let seekFrame = null;
  document.addEventListener('mousemove', e => {
    if (!playheadDragging) return;
    const rect = timelineScrollEl.getBoundingClientRect();
    pendingSeekX = e.clientX - rect.left + timelineScrollEl.scrollLeft;
    if (seekFrame !== null) return;
    seekFrame = requestAnimationFrame(() => {
      seekFrame = null;
      if (pendingSeekX !== null) seekFromContentX(pendingSeekX);
    });
  });
  document.addEventListener('mouseup', () => { playheadDragging = false; pendingSeekX = null; });

  const CLIP_ROW_HEIGHT = 38;
  const KIND_ICONS = {
    video: '<polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>',
    audio: '<path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle>',
    text: '<polyline points="4 7 4 4 20 4 20 7"></polyline><line x1="9" y1="20" x2="15" y2="20"></line><line x1="12" y1="4" x2="12" y2="20"></line>',
  };

  // Everything lives on one timeline, so two clips that cover the same
  // moment would otherwise draw on top of each other. Give each one the
  // first row where nothing else is already sitting.
  function packClips(entries) {
    const rows = [];
    return entries
      .slice()
      .sort((a, b) => a.clip.start_time - b.clip.start_time)
      .map(entry => {
        let row = 0;
        for (;;) {
          const occupants = rows[row] || (rows[row] = []);
          const clashes = occupants.some(o =>
            entry.clip.start_time < o.end_time - 1e-6 && o.start_time < entry.clip.end_time - 1e-6);
          if (!clashes) { occupants.push(entry.clip); break; }
          row++;
        }
        return { ...entry, row };
      });
  }

  function renderLane(entries, widthPx) {
    timelineLaneEl.innerHTML = '';
    timelineLaneEl.style.width = widthPx + 'px';
    const packed = packClips(entries);
    const rowCount = packed.reduce((max, e) => Math.max(max, e.row + 1), 1);
    timelineLaneEl.style.height = (rowCount * CLIP_ROW_HEIGHT + 6) + 'px';

    packed.forEach(({ clip, kind, row }) => {
      const box = document.createElement('div');
      box.className = 'clip-box ' + kind + (clip.id === selectedClipId ? ' selected' : '');
      box.dataset.clipId = clip.id;
      box.style.left = (clip.start_time * PX_PER_SEC) + 'px';
      box.style.top = (row * CLIP_ROW_HEIGHT + 4) + 'px';
      box.style.width = Math.max(clip.duration * PX_PER_SEC, 24) + 'px';

      const icon = document.createElement('span');
      icon.className = 'clip-kind';
      icon.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${KIND_ICONS[kind] || ''}</svg>`;
      box.appendChild(icon);
      box.appendChild(document.createTextNode(clip.label || clip.id));
      box.title = `${clip.label || clip.id} — ${kind}, ${clip.duration.toFixed(1)}s`;

      box.addEventListener('mousedown', e => startClipDrag(e, box, clip, kind));
      box.addEventListener('click', e => {
        e.stopPropagation();
        setSelectedClip(clip.id);
      });
      timelineLaneEl.appendChild(box);
    });
  }

  // Selecting a clip used to re-render every lane and every ruler tick.
  // Nothing about the clips changed — only which one is highlighted — so
  // just move the class and refresh the inspector.
  function setSelectedClip(id) {
    selectedClipId = id;
    document.querySelectorAll('.clip-box').forEach(el => {
      el.classList.toggle('selected', el.dataset.clipId === id);
    });
    renderInspector();
  }

  function allClipEntries() {
    const entries = [];
    (currentTracks || []).forEach(track => {
      (track.clips || []).forEach(clip => entries.push({ clip, kind: track.kind }));
    });
    return entries;
  }

  function renderTracks(tracks) {
    currentTracks = tracks || [];
    const duration = timelineDuration(currentTracks);
    const widthPx = duration * PX_PER_SEC;
    renderRuler(duration);
    renderLane(allClipEntries(), widthPx);
    updateCaptionOverlay();
    updatePlayheadPosition();
    renderInspector();
  }

  function startClipDrag(e, boxEl, clip, kind) {
    e.preventDefault();
    dragState = {
      boxEl, clip, kind,
      startMouseX: e.clientX,
      startLeftPx: clip.start_time * PX_PER_SEC,
      newStartTime: undefined,
    };
    boxEl.classList.add('dragging');
    document.addEventListener('mousemove', onClipDragMove);
    document.addEventListener('mouseup', onClipDragEnd);
  }

  function onClipDragMove(e) {
    if (!dragState) return;
    const deltaPx = e.clientX - dragState.startMouseX;
    const newLeftPx = Math.max(0, dragState.startLeftPx + deltaPx);
    dragState.boxEl.style.left = newLeftPx + 'px';
    dragState.newStartTime = newLeftPx / PX_PER_SEC;
  }

  async function onClipDragEnd() {
    document.removeEventListener('mousemove', onClipDragMove);
    document.removeEventListener('mouseup', onClipDragEnd);
    const state = dragState;
    dragState = null;
    if (!state) return;
    state.boxEl.classList.remove('dragging');
    if (state.newStartTime === undefined || Math.abs(state.newStartTime - state.clip.start_time) < 0.01) {
      return; // no meaningful move — leave as-is, no need to round-trip to the backend
    }
    const result = await window.pywebview.api.move_clip(state.kind, state.clip.id, state.newStartTime);
    if (result.error) { alert(result.error); }
    refreshTracks();
  }

  // ---- keyboard control: space to play/pause, arrows to seek or nudge
  // the selected clip, so the mouse isn't required for basic editing ----
  function findSelectedClip() {
    if (!selectedClipId) return null;
    for (const track of currentTracks) {
      const clip = (track.clips || []).find(c => c.id === selectedClipId);
      if (clip) return { kind: track.kind, clip };
    }
    return null;
  }

  async function nudgeSelectedClip(deltaSeconds) {
    const found = findSelectedClip();
    if (!found) return;
    const newStart = Math.max(0, found.clip.start_time + deltaSeconds);
    const result = await window.pywebview.api.move_clip(found.kind, found.clip.id, newStart);
    if (result.error) { alert(result.error); return; }
    refreshTracks();
  }

  document.addEventListener('keydown', e => {
    // never hijack typing — inputs/textareas/selects (composer, rename,
    // script textarea, transcript search, aspect-ratio picker) all need
    // their own arrow/space/backspace behavior
    const activeTag = document.activeElement ? document.activeElement.tagName : '';
    if (activeTag === 'INPUT' || activeTag === 'TEXTAREA' || activeTag === 'SELECT') return;
    if (getComputedStyle(editorScreenEl).display === 'none') return; // only on the editor screen

    if (e.code === 'Space') {
      e.preventDefault();
      if (previewEl.paused) previewEl.play(); else previewEl.pause();
      return;
    }
    // Tab / Shift+Tab step through the clips on the timeline, Escape drops
    // the selection — so the whole timeline is reachable without a mouse.
    if (e.key === 'Tab') {
      const entries = allClipEntries();
      if (!entries.length) return;
      e.preventDefault();
      const ordered = entries.sort((a, b) => a.clip.start_time - b.clip.start_time);
      const at = ordered.findIndex(entry => entry.clip.id === selectedClipId);
      const step = e.shiftKey ? -1 : 1;
      const next = at === -1
        ? (e.shiftKey ? ordered.length - 1 : 0)
        : (at + step + ordered.length) % ordered.length;
      setSelectedClip(ordered[next].clip.id);
      previewEl.currentTime = ordered[next].clip.start_time;
      return;
    }
    if (e.key === 'Escape') {
      setSelectedClip(null);
      return;
    }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      e.preventDefault();
      const sign = e.key === 'ArrowLeft' ? -1 : 1;
      if (selectedClipId) {
        // moving a clip in whole seconds is more useful than sub-second —
        // shift for a coarser 1s nudge, plain for a fine 0.1s one
        nudgeSelectedClip(sign * (e.shiftKey ? 1 : 0.1));
      } else {
        // plain arrow = ~1s (close enough to "a frame or two" without
        // needing to know the source's actual fps), shift = 5s jump
        previewEl.currentTime = Math.max(0, previewEl.currentTime + sign * (e.shiftKey ? 5 : 1));
      }
    }
  });

  timelineLaneEl.addEventListener('click', () => setSelectedClip(null));

  // ---- inspector: real per-clip colour adjustment, no sliders ----
  const EFFECT_FIELDS = [
    { key: 'brightness', label: 'Brightness', min: -1, max: 1, step: 0.1, def: 0 },
    { key: 'contrast', label: 'Contrast', min: 0, max: 3, step: 0.1, def: 1 },
    { key: 'saturation', label: 'Saturation', min: 0, max: 3, step: 0.1, def: 1 },
  ];

  function renderInspector() {
    const found = findSelectedClip();
    inspectorBodyEl.innerHTML = '';
    if (!found) {
      const empty = document.createElement('div');
      empty.className = 'inspector-empty';
      empty.textContent = 'Select a clip in the timeline to adjust it.';
      inspectorBodyEl.appendChild(empty);
      return;
    }
    const clip = found.clip;
    const effects = clip.effects || {};

    const meta = document.createElement('div');
    meta.className = 'inspector-meta';
    const name = document.createElement('strong');
    name.textContent = clip.label || clip.id;
    meta.appendChild(name);
    meta.appendChild(document.createTextNode(
      `${found.kind} · ${clip.duration.toFixed(1)}s · starts ${formatTime(clip.start_time)}`
    ));
    inspectorBodyEl.appendChild(meta);

    if (found.kind === 'video') {
      EFFECT_FIELDS.forEach(field => {
        const value = effects[field.key] !== undefined ? effects[field.key] : field.def;
        const wrap = document.createElement('div');
        wrap.className = 'inspector-field';
        const label = document.createElement('label');
        label.textContent = field.label;
        const stepper = document.createElement('div');
        stepper.className = 'stepper';
        const minus = document.createElement('button');
        minus.textContent = '−';
        const readout = document.createElement('span');
        readout.className = 'stepper-value';
        readout.textContent = value.toFixed(2);
        const plus = document.createElement('button');
        plus.textContent = '+';
        const apply = delta => {
          // round the step, or repeated +0.1s drift into 0.30000000000000004
          const next = Math.round(Math.max(field.min, Math.min(field.max, value + delta)) * 100) / 100;
          setClipEffect(clip.id, field.key, next);
        };
        minus.addEventListener('click', () => apply(-field.step));
        plus.addEventListener('click', () => apply(field.step));
        stepper.appendChild(minus);
        stepper.appendChild(readout);
        stepper.appendChild(plus);
        wrap.appendChild(label);
        wrap.appendChild(stepper);
        inspectorBodyEl.appendChild(wrap);
      });

      const bw = document.createElement('button');
      bw.className = 'tool-btn';
      bw.style.cssText = 'width:100%;justify-content:center;margin-bottom:8px;';
      bw.textContent = effects.grayscale ? '✓ Black & white' : 'Black & white';
      if (effects.grayscale) bw.classList.add('primary');
      bw.addEventListener('click', () => setClipEffect(clip.id, 'grayscale', !effects.grayscale));
      inspectorBodyEl.appendChild(bw);

      const reset = document.createElement('button');
      reset.className = 'tool-btn';
      reset.style.cssText = 'width:100%;justify-content:center;';
      reset.textContent = 'Reset adjustments';
      reset.addEventListener('click', async () => {
        const result = await window.pywebview.api.reset_clip_effects(clip.id);
        if (result.error) { alert(result.error); return; }
        await refreshTracks();
      });
      inspectorBodyEl.appendChild(reset);
    }
  }

  async function setClipEffect(clipId, effect, value) {
    const result = await window.pywebview.api.set_clip_effect(clipId, effect, value);
    if (result.error) { alert(result.error); return; }
    await refreshTracks(); // re-renders the inspector with the new values
  }

  // The transcript/search panel replaces the video preview in the same
  // slot (chosen over adding a separate panel below the tool rail, to
  // keep the top row compact) — toggled by the Transcribe icon.
  function showPreviewPane(which) {
    previewWrapEl.style.display = which === 'video' ? 'flex' : 'none';
    transcriptPanelEl.style.display = which === 'transcript' ? 'flex' : 'none';
  }

  function renderTranscript(segments) {
    transcriptListEl.innerHTML = '';
    (segments || []).forEach(seg => {
      const row = document.createElement('div');
      row.className = 'transcript-row';
      const ts = document.createElement('span');
      ts.className = 'ts';
      ts.textContent = formatTime(seg.start);
      row.appendChild(ts);
      row.appendChild(document.createTextNode(seg.text));
      row.addEventListener('click', () => {
        previewEl.currentTime = seg.start;
      });
      transcriptListEl.appendChild(row);
    });
  }

  function hydrateProject(result) {
    if (!result) return;
    if (result.path) {
      previewEl.src = result.path; // already a served http://127.0.0.1:<port>/media?... URL
      previewEmptyEl.style.display = 'none';
    } else {
      previewEl.removeAttribute('src');
      previewEl.load();
      previewEmptyEl.style.display = 'flex';
    }

    // The in/out range defaults to the whole source rather than a fixed
    // 0-5s, so a bare "Cut" with nothing marked takes the entire clip.
    const duration = result.info && result.info.duration_seconds;
    inPoint = 0;
    outPoint = duration || 5;
    updateRangeReadout();

    const project = result.project || {};
    headerTitleEl.textContent = project.name || 'Scenecraft';
    selectedClipId = null;
    renderTracks(project.tracks);
    currentScript = project.script || [];
    aspectRatioSelectEl.value = project.aspect_ratio || 'auto';

    currentTranscript = project.transcript || [];
    transcriptSearchEl.value = '';
    showPreviewPane('video'); // always land on the video, even if a transcript already exists
    if (currentTranscript.length) {
      transcriptStatusEl.textContent = `${currentTranscript.length} segments`;
      renderTranscript(currentTranscript);
      transcribeBtnEl.classList.add('active');
    } else {
      transcriptStatusEl.textContent = '';
      transcriptListEl.innerHTML = '';
      transcribeBtnEl.classList.remove('active');
    }

    statusEl.textContent = '';
    showScreen('editor');
    refreshModelIndicator();
  }

  let editMode = 'manual';
  function setEditMode(mode) {
    editMode = mode;
    editorMainEl.classList.toggle('director-mode', mode === 'director');
    modeManualBtnEl.classList.toggle('active', mode === 'manual');
    modeAiBtnEl.classList.toggle('active', mode === 'director');
    if (mode === 'director') setTimeout(() => composerInputEl.focus(), 0);
  }

  // Openers, not command syntax — you don't have to phrase anything a
  // particular way, and vague ones get answered with a question.
  const CHAT_SUGGESTIONS = [
    'What can you do?',
    'Write me a script',
    'Make a motion graphic',
    'Add captions',
  ];
  CHAT_SUGGESTIONS.forEach(text => {
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.textContent = text;
    chip.addEventListener('click', () => {
      composerInputEl.value = text;
      composerInputEl.focus();
      runComposerCommand();
    });
    chatSuggestionsEl.appendChild(chip);
  });

  async function refreshModelIndicator() {
    const status = await window.pywebview.api.get_model_status();
    if (!status) return;
    modelIndicatorDotEl.classList.toggle('offline', !status.ollama_available);
    if (!status.ollama_available) {
      modelIndicatorLabelEl.textContent = 'AI offline';
      return;
    }
    const known = status.known_models.find(m => m.id === status.active_model);
    const name = known ? known.label : status.active_model;
    modelIndicatorLabelEl.textContent = status.active_model_installed
      ? `Local · ${name}`
      : `Local · ${name} (not installed)`;
  }

  async function newProjectFlow() {
    // No dialog, no prompt — straight into an empty editor. The project
    // name is auto-generated behind the scenes purely so there's a
    // project.json to write to; the user can rename it later by clicking
    // the name in the header.
    const result = await window.pywebview.api.new_project();
    if (result.error) { alert(result.error); return; }
    hydrateProject(result);
  }

  async function importVideo() {
    statusEl.textContent = 'Importing…';
    const result = await window.pywebview.api.import_video();
    if (!result) { statusEl.textContent = ''; return; } // user cancelled the file dialog
    if (result.error) { statusEl.textContent = 'Import error: ' + result.error; return; }
    hydrateProject(result);
    statusEl.textContent = '';
  }

  function startRenameProject() {
    const currentName = headerTitleEl.textContent;
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'header-title-input';
    input.value = currentName;
    headerTitleEl.replaceWith(input);
    input.focus();
    input.select();

    let committed = false;
    const commit = async () => {
      if (committed) return;
      committed = true;
      const newName = input.value.trim();
      input.replaceWith(headerTitleEl);
      if (!newName || newName === currentName) return;
      const result = await window.pywebview.api.rename_project(newName);
      if (result.error) { alert(result.error); return; }
      headerTitleEl.textContent = result.name;
    };
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') input.blur();
      if (e.key === 'Escape') { input.value = currentName; input.blur(); }
    });
    input.addEventListener('blur', commit);
  }

  async function openProjectFlow() {
    const projects = await window.pywebview.api.list_projects();
    showModal('Open project');
    modalConfirmEl.style.display = 'none';

    if (!projects.length) {
      const p = document.createElement('p');
      p.style.color = 'var(--text-muted)';
      p.textContent = 'No saved projects found in ~/Scenecraft.';
      modalBodyEl.appendChild(p);
      return;
    }

    const list = document.createElement('div');
    list.className = 'project-list';
    projects.forEach(proj => {
      const row = document.createElement('div');
      row.className = 'project-row';
      row.textContent = proj.name;
      row.addEventListener('click', async () => {
        hideModal();
        const result = await window.pywebview.api.open_project(proj.path);
        if (result.error) { alert(result.error); return; }
        hydrateProject(result);
      });
      list.appendChild(row);
    });
    modalBodyEl.appendChild(list);
  }

  // In/out points replace the old "Start (s) / End (s)" number fields —
  // you scrub to a moment and mark it, the way an editor actually works,
  // instead of typing seconds into a spinner.
  let inPoint = 0;
  let outPoint = 5;

  function updateRangeReadout() {
    // tenths here, unlike the m:ss used elsewhere: this range is the exact
    // cut that gets made, and flooring 2.9s to "0:02" misrepresents it
    const precise = s => `${Math.floor(s / 60)}:${(s % 60).toFixed(1).padStart(4, '0')}`;
    rangeReadoutEl.textContent = `${precise(inPoint)} → ${precise(outPoint)}`;
  }

  markInBtnEl.addEventListener('click', () => {
    inPoint = previewEl.currentTime || 0;
    if (outPoint <= inPoint) outPoint = inPoint + 1;
    updateRangeReadout();
  });
  markOutBtnEl.addEventListener('click', () => {
    outPoint = previewEl.currentTime || 0;
    if (outPoint <= inPoint) inPoint = Math.max(0, outPoint - 1);
    updateRangeReadout();
  });

  async function cutScene() {
    const start = inPoint;
    const end = outPoint;
    statusEl.textContent = 'Cutting…';
    const result = await window.pywebview.api.cut_scene(start, end);
    if (result.error) {
      statusEl.textContent = 'Error: ' + result.error;
      return;
    }
    statusEl.textContent = 'Saved ' + result.scene_id;
    refreshTracks();
  }

  async function refreshTracks() {
    const tracks = await window.pywebview.api.get_tracks();
    renderTracks(tracks);
  }

  async function toggleTranscribe() {
    const showingTranscript = transcriptPanelEl.style.display === 'flex';
    if (showingTranscript) {
      showPreviewPane('video'); // clicking again while open switches back to the video
      return;
    }
    showPreviewPane('transcript');
    if (currentTranscript.length > 0) {
      return; // already transcribed — just showing the panel, no need to re-run
    }

    transcribeBtnEl.disabled = true;
    transcriptStatusEl.textContent = 'Transcribing… this can take a while.';
    transcriptListEl.innerHTML = '';
    const result = await window.pywebview.api.transcribe();
    transcribeBtnEl.disabled = false;
    if (result.error) {
      transcriptStatusEl.textContent = 'Error: ' + result.error;
      return;
    }
    currentTranscript = result.transcript;
    transcriptStatusEl.textContent = `${currentTranscript.length} segments`;
    renderTranscript(currentTranscript);
    transcribeBtnEl.classList.add('active');
  }

  // Was firing a search API call on every single keystroke; debounce so a
  // typed word costs one round trip instead of one per character.
  let transcriptSearchTimer = null;
  transcriptSearchEl.addEventListener('input', e => {
    const query = e.target.value;
    clearTimeout(transcriptSearchTimer);
    transcriptSearchTimer = setTimeout(async () => {
      const results = await window.pywebview.api.search_transcript(query);
      renderTranscript(results);
    }, 180);
  });

  async function openSettingsFlow() {
    const settings = await window.pywebview.api.get_settings();
    const modelStatus = await window.pywebview.api.get_model_status();
    showModal('Settings');

    const modelLabel = document.createElement('label');
    modelLabel.style.cssText = 'font-size:12px;color:var(--text-muted);display:block;';
    modelLabel.textContent = modelStatus.ollama_available
      ? 'Local AI model — powers the composer’s AI fallback, script writing, and motion graphics'
      : 'Local AI model — Ollama isn’t running right now, so AI features are unavailable';
    const modelSelect = document.createElement('select');
    modelSelect.style.cssText = 'width:100%;margin:6px 0 16px;background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 8px;';
    modelStatus.known_models.forEach(m => {
      const opt = document.createElement('option');
      opt.value = m.id;
      const installed = modelStatus.installed_models.includes(m.id);
      opt.textContent = m.label + (installed ? '' : ' (not installed)');
      if (m.id === modelStatus.active_model) opt.selected = true;
      modelSelect.appendChild(opt);
    });
    modalBodyEl.appendChild(modelLabel);
    modalBodyEl.appendChild(modelSelect);

    const label = document.createElement('label');
    label.style.fontSize = '12px';
    label.style.color = 'var(--text-muted)';
    label.textContent = 'API key (stored locally only — nothing in the app sends this anywhere; every AI feature here runs on the local model above, not this key)';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = 'sk-...';
    input.value = settings.api_key || '';
    input.style.marginTop = '8px';
    modalBodyEl.appendChild(label);
    modalBodyEl.appendChild(input);
    setTimeout(() => input.focus(), 0);

    modalConfirmEl.textContent = 'Save';
    modalConfirmEl.onclick = async () => {
      await window.pywebview.api.set_api_key(input.value);
      await window.pywebview.api.set_local_model(modelSelect.value);
      hideModal();
      modalConfirmEl.textContent = 'Continue';
      refreshModelIndicator();
    };
  }

  async function runComposerCommand() {
    const text = composerInputEl.value.trim();
    if (!text) return;
    composerInputEl.value = '';
    addComposerMessage('user', text);
    const pendingEl = addComposerMessage('ai', 'Working…', { pending: true });

    // chat(), not run_command(): exact commands still take the instant
    // offline path inside it, but "hello" or a half-formed request gets a
    // real reply or a follow-up question instead of a parser error.
    const response = await window.pywebview.api.chat(text, previewEl.currentTime || 0, selectedClipId);
    if (!response) { pendingEl.remove(); return; }

    pendingEl.remove();
    addComposerMessage('ai', response.message || response.error || "Didn't catch that.", { error: !!response.error });

    if (response.error) return; // unrecognized or failed — nothing else changed

    if (response.action === 'import' && response.result && response.result.path) {
      hydrateProject(response.result);
      return;
    }
    if (response.action === 'transcribe' && response.result && response.result.transcript) {
      currentTranscript = response.result.transcript;
      transcriptStatusEl.textContent = `${currentTranscript.length} segments`;
      renderTranscript(currentTranscript);
      transcribeBtnEl.classList.add('active');
      showPreviewPane('transcript');
    }
    if (response.action === 'search' && response.result) {
      renderTranscript(response.result.matches);
      transcriptSearchEl.value = response.result.query;
      showPreviewPane('transcript');
    }
    if (response.action === 'write_script' && response.result && response.result.script) {
      currentScript = response.result.script;
    }
    if (response.action === 'seek' && response.result) {
      showPreviewPane('video');
      previewEl.currentTime = response.result.time;
    }
    refreshTracks();
  }

  // ---- guided recording: script -> teleprompter -> per-scene capture ----

  function openScriptFlow() {
    if (currentScript && currentScript.length) {
      // already have a script from an earlier session — resume straight
      // into recording rather than asking to paste it again
      enterRecordingMode();
      return;
    }
    showScriptModal();
  }

  function showScriptModal() {
    showModal(currentScript && currentScript.length ? 'Edit script' : 'Add your script');
    const hint = document.createElement('p');
    hint.style.cssText = 'font-size:12px;color:var(--text-muted);margin:0 0 8px;';
    hint.textContent = 'Separate scenes with a blank line, or label them "Scene 1:", "Scene 2:". Put acting notes in [brackets].';
    const textarea = document.createElement('textarea');
    textarea.placeholder = 'Scene 1:\n[smile, look at camera]\nHi everyone, welcome back...\n\nScene 2:\nToday we\'re going to...';
    modalBodyEl.appendChild(hint);
    modalBodyEl.appendChild(textarea);
    setTimeout(() => textarea.focus(), 0);

    modalConfirmEl.textContent = 'Save & start recording';
    modalConfirmEl.onclick = async () => {
      const text = textarea.value.trim();
      if (!text) return;
      const result = await window.pywebview.api.set_script(text);
      if (result.error) { alert(result.error); return; }
      hideModal();
      modalConfirmEl.textContent = 'Continue';
      currentScript = result.script;
      enterRecordingMode();
    };
  }

  function enterRecordingMode() {
    currentSceneIndex = 0;
    showScreen('recording');
    renderCurrentScene();
    startCamera();
  }

  async function startCamera() {
    try {
      cameraStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      cameraPreviewEl.muted = true;
      cameraPreviewEl.srcObject = cameraStream;
    } catch (e) {
      alert('Could not access the camera/microphone: ' + e.message);
    }
  }

  function stopCamera() {
    if (cameraStream) {
      cameraStream.getTracks().forEach(t => t.stop());
      cameraStream = null;
    }
  }

  function resetTakePreview() {
    pendingTakeBlob = null;
    cameraPreviewEl.controls = false;
    cameraPreviewEl.muted = true;
    cameraPreviewEl.removeAttribute('src');
    cameraPreviewEl.srcObject = cameraStream;
  }

  function renderCurrentScene() {
    const scene = currentScript[currentSceneIndex];
    if (!scene) return;
    sceneNumberEl.textContent = currentSceneIndex + 1;
    sceneTotalEl.textContent = currentScript.length;
    teleprompterTextEl.textContent = scene.text || '(no line for this scene — see direction)';
    teleprompterDirectionEl.textContent = scene.direction || '';
    teleprompterDirectionEl.style.display = scene.direction ? 'block' : 'none';
    const recordedCount = currentScript.filter(s => s.recorded_path).length;
    recordingProgressEl.textContent = `${recordedCount} / ${currentScript.length} recorded`;

    recordBtnEl.style.display = '';
    stopBtnEl.style.display = 'none';
    retakeBtnEl.style.display = scene.recorded_path ? '' : 'none';
    useTakeBtnEl.style.display = 'none';
    document.getElementById('prev-scene-btn').disabled = currentSceneIndex === 0;
    document.getElementById('next-scene-btn').disabled = currentSceneIndex === currentScript.length - 1;
  }

  function startRecordingTake() {
    if (!cameraStream) { alert('Camera not ready yet.'); return; }
    recordedChunks = [];
    mediaRecorder = new MediaRecorder(cameraStream);
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = onTakeStopped;
    mediaRecorder.start();
    recordingIndicatorEl.style.display = '';
    recordBtnEl.style.display = 'none';
    stopBtnEl.style.display = '';
  }

  function stopRecordingTake() {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    recordingIndicatorEl.style.display = 'none';
  }

  function onTakeStopped() {
    stopBtnEl.style.display = 'none';
    retakeBtnEl.style.display = '';
    useTakeBtnEl.style.display = '';
    pendingTakeBlob = new Blob(recordedChunks, { type: 'video/webm' });
    cameraPreviewEl.srcObject = null;
    cameraPreviewEl.src = URL.createObjectURL(pendingTakeBlob);
    cameraPreviewEl.muted = false;
    cameraPreviewEl.controls = true;
    cameraPreviewEl.play();
  }

  async function useTake() {
    const scene = currentScript[currentSceneIndex];
    if (!pendingTakeBlob || !scene) return;
    const slot = await window.pywebview.api.create_upload_slot(scene.id);
    if (slot.error) { alert(slot.error); return; }

    useTakeBtnEl.disabled = true;
    useTakeBtnEl.textContent = 'Uploading…';
    try {
      const uploadResp = await fetch(slot.upload_url, { method: 'POST', body: pendingTakeBlob });
      const uploadJson = await uploadResp.json();
      if (!uploadJson.ok) throw new Error('upload failed');

      const result = await window.pywebview.api.finish_scene_recording(scene.id, uploadJson.path);
      if (result.error) { alert(result.error); return; }
      currentScript = result.project.script;
      resetTakePreview();
      if (currentSceneIndex < currentScript.length - 1) currentSceneIndex++;
      renderCurrentScene();
    } catch (e) {
      alert('Could not save that take: ' + e.message);
    } finally {
      useTakeBtnEl.disabled = false;
      useTakeBtnEl.textContent = 'Use this take';
    }
  }

  function goToScene(delta) {
    const next = currentSceneIndex + delta;
    if (next < 0 || next >= currentScript.length) return;
    currentSceneIndex = next;
    resetTakePreview();
    renderCurrentScene();
  }

  async function exitRecordingMode() {
    const leave = confirm('Exit recording mode? Recorded takes are already saved on the timeline; anything not recorded yet stays pending — resume anytime.');
    if (!leave) return;
    stopRecordingTake();
    stopCamera();
    resetTakePreview();
    showScreen('editor');
    refreshTracks();
  }

  async function goBack() {
    const leave = confirm('Leave this project and go back? Your work is saved automatically.');
    if (!leave) return;
    await window.pywebview.api.save_project();
    showScreen('start');
  }

  document.getElementById('back-btn').addEventListener('click', goBack);
  document.getElementById('new-project-btn').addEventListener('click', newProjectFlow);
  document.getElementById('open-project-btn').addEventListener('click', openProjectFlow);
  headerTitleEl.addEventListener('click', startRenameProject);
  document.getElementById('script-btn').addEventListener('click', openScriptFlow);
  document.getElementById('import-btn').addEventListener('click', importVideo);
  document.getElementById('audio-btn').addEventListener('click', async () => {
    statusEl.textContent = 'Adding audio…';
    const result = await window.pywebview.api.add_audio_clip();
    if (!result) { statusEl.textContent = ''; return; } // cancelled
    if (result.error) { statusEl.textContent = 'Error: ' + result.error; return; }
    statusEl.textContent = 'Added audio clip.';
    refreshTracks();
  });
  document.getElementById('text-btn').addEventListener('click', async () => {
    statusEl.textContent = 'Generating captions…';
    const result = await window.pywebview.api.generate_captions();
    if (result.error) { statusEl.textContent = 'Error: ' + result.error; return; }
    statusEl.textContent = `Added ${result.count} caption${result.count === 1 ? '' : 's'}.`;
    refreshTracks();
  });
  document.getElementById('cut-btn').addEventListener('click', cutScene);
  document.getElementById('transcribe-btn').addEventListener('click', toggleTranscribe);
  document.getElementById('settings-btn').addEventListener('click', openSettingsFlow);
  modelIndicatorBtnEl.addEventListener('click', openSettingsFlow);
  modeManualBtnEl.addEventListener('click', () => setEditMode('manual'));
  modeAiBtnEl.addEventListener('click', () => setEditMode('director'));
  aspectRatioSelectEl.addEventListener('change', async () => {
    const result = await window.pywebview.api.set_aspect_ratio(aspectRatioSelectEl.value);
    if (result.error) { alert(result.error); return; }
    statusEl.textContent = `Export frame set to ${aspectRatioSelectEl.value}.`;
  });
  document.getElementById('composer-send').addEventListener('click', runComposerCommand);
  composerInputEl.addEventListener('keydown', e => { if (e.key === 'Enter') runComposerCommand(); });
  document.getElementById('export-btn').addEventListener('click', async () => {
    statusEl.textContent = 'Exporting…';
    const result = await window.pywebview.api.export_project();
    if (!result) { statusEl.textContent = ''; return; } // user cancelled the save dialog
    if (result.error) {
      statusEl.textContent = 'Export error: ' + result.error;
      return;
    }
    statusEl.textContent = 'Exported to ' + result.path;
  });

  document.getElementById('recording-exit-btn').addEventListener('click', exitRecordingMode);
  document.getElementById('edit-script-btn').addEventListener('click', showScriptModal);
  document.getElementById('record-btn').addEventListener('click', startRecordingTake);
  document.getElementById('stop-btn').addEventListener('click', stopRecordingTake);
  document.getElementById('retake-btn').addEventListener('click', () => { resetTakePreview(); renderCurrentScene(); });
  document.getElementById('use-take-btn').addEventListener('click', useTake);
  document.getElementById('prev-scene-btn').addEventListener('click', () => goToScene(-1));
  document.getElementById('next-scene-btn').addEventListener('click', () => goToScene(1));

  showScreen('start');
</script>

</body>
</html>
