<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Scenecraft</title>
<style>
  :root {
    --bg: #121212;
    --panel: #1c1c1c;
    --border: #2c2c2c;
    --text: #e8e8e6;
    --text-muted: #8a8a86;
    --accent: #7f77dd;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 15px; font-weight: 500; margin: 0; }
  button {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 14px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #121212; border: none; }
  main { flex: 1; display: flex; overflow: hidden; }
  .editor { flex: 1; display: flex; flex-direction: column; padding: 16px; gap: 12px; }
  video { width: 100%; max-height: 55vh; background: #000; border-radius: 8px; }
  .empty-state {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; color: var(--text-muted);
  }
  .trim-controls { display: flex; gap: 10px; align-items: center; font-size: 13px; }
  .trim-controls input { width: 80px; background: var(--panel); border: 1px solid var(--border);
    color: var(--text); border-radius: 4px; padding: 5px 8px; }
  .scenes { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0; }
  .scene-chip {
    flex: 0 0 auto; padding: 8px 12px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 6px; font-size: 12px; color: var(--text-muted);
  }
  aside { width: 260px; border-left: 1px solid var(--border); padding: 16px; font-size: 12px; color: var(--text-muted); overflow-y: auto; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    display: none; align-items: center; justify-content: center; z-index: 10;
  }
  .modal {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 20px; width: 340px; max-width: 90vw; max-height: 70vh; display: flex;
    flex-direction: column; gap: 12px;
  }
  .modal h2 { margin: 0; font-size: 14px; font-weight: 500; }
  .modal input[type="text"] {
    width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 8px 10px; font-size: 13px;
  }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .modal-body { overflow-y: auto; }
  .project-list { display: flex; flex-direction: column; gap: 4px; max-height: 40vh; overflow-y: auto; }
  .project-row {
    padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  .project-row:hover { border-color: var(--accent); }

  .transcript-header { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; }
  .transcript-header strong { color: var(--text); }
  #transcript-search {
    width: 100%; margin: 8px 0; background: var(--bg); border: 1px solid var(--border);
    color: var(--text); border-radius: 4px; padding: 6px 8px; font-size: 12px;
  }
  .transcript-list { display: flex; flex-direction: column; gap: 4px; }
  .transcript-row {
    padding: 6px 8px; border-radius: 4px; cursor: pointer; line-height: 1.4;
  }
  .transcript-row:hover { background: var(--bg); }
  .transcript-row .ts { color: var(--accent); margin-right: 6px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<header>
  <h1 id="header-title">Scenecraft</h1>
  <div style="display:flex; gap:8px;">
    <button id="open-btn">Open video</button>
    <button id="export-btn" class="primary">Export</button>
  </div>
</header>

<main>
  <div class="editor">
    <div id="empty" class="empty-state">
      <p>No video loaded yet.</p>
      <div style="display:flex; gap:8px;">
        <button id="start-project-btn" class="primary">Start a project</button>
        <button id="open-btn-2">Open a video to start</button>
        <button id="open-project-btn">Open project</button>
      </div>
    </div>

    <div id="workspace" style="display:none; flex-direction:column; gap:12px;">
      <video id="preview" controls></video>

      <div class="trim-controls">
        <label>Start (s) <input id="start" type="number" min="0" step="0.1" value="0" /></label>
        <label>End (s) <input id="end" type="number" min="0" step="0.1" value="5" /></label>
        <button id="cut-btn">Cut scene</button>
        <button id="transcribe-btn">Transcribe</button>
        <span id="status" style="color: var(--text-muted);"></span>
      </div>

      <div id="scenes" class="scenes"></div>
    </div>
  </div>

  <aside>
    <p><strong style="color: var(--text);">Project info</strong></p>
    <p id="info">Nothing loaded.</p>

    <div class="transcript-header">
      <strong>Transcript</strong>
    </div>
    <input id="transcript-search" type="text" placeholder="Search transcript…" />
    <div id="transcript-status" style="margin-bottom:6px;"></div>
    <div id="transcript-list" class="transcript-list"></div>
  </aside>
</main>

<div id="modal-overlay" class="modal-overlay">
  <div class="modal">
    <h2 id="modal-title"></h2>
    <div id="modal-body" class="modal-body"></div>
    <div class="modal-actions">
      <button id="modal-cancel">Cancel</button>
      <button id="modal-confirm" class="primary">Continue</button>
    </div>
  </div>
</div>

<script>
  const emptyEl = document.getElementById('empty');
  const workspaceEl = document.getElementById('workspace');
  const previewEl = document.getElementById('preview');
  const infoEl = document.getElementById('info');
  const scenesEl = document.getElementById('scenes');
  const statusEl = document.getElementById('status');
  const headerTitleEl = document.getElementById('header-title');
  const transcribeBtnEl = document.getElementById('transcribe-btn');
  const transcriptSearchEl = document.getElementById('transcript-search');
  const transcriptStatusEl = document.getElementById('transcript-status');
  const transcriptListEl = document.getElementById('transcript-list');

  const modalOverlayEl = document.getElementById('modal-overlay');
  const modalTitleEl = document.getElementById('modal-title');
  const modalBodyEl = document.getElementById('modal-body');
  const modalConfirmEl = document.getElementById('modal-confirm');
  const modalCancelEl = document.getElementById('modal-cancel');

  let currentTranscript = [];

  function showModal(title) {
    modalTitleEl.textContent = title;
    modalBodyEl.innerHTML = '';
    modalOverlayEl.style.display = 'flex';
  }

  function hideModal() {
    modalOverlayEl.style.display = 'none';
    modalBodyEl.innerHTML = '';
    modalConfirmEl.style.display = '';
    modalConfirmEl.onclick = null;
  }

  modalCancelEl.addEventListener('click', hideModal);

  function renderScenes(scenes) {
    scenesEl.innerHTML = '';
    (scenes || []).forEach(s => {
      const chip = document.createElement('div');
      chip.className = 'scene-chip';
      chip.textContent = `${s.id} (${s.start}s–${s.end}s)`;
      scenesEl.appendChild(chip);
    });
  }

  function formatTime(seconds) {
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  function renderTranscript(segments) {
    transcriptListEl.innerHTML = '';
    (segments || []).forEach(seg => {
      const row = document.createElement('div');
      row.className = 'transcript-row';
      const ts = document.createElement('span');
      ts.className = 'ts';
      ts.textContent = formatTime(seg.start);
      row.appendChild(ts);
      row.appendChild(document.createTextNode(seg.text));
      row.addEventListener('click', () => {
        previewEl.currentTime = seg.start;
      });
      transcriptListEl.appendChild(row);
    });
  }

  function hydrateProject(result) {
    if (!result) return;
    emptyEl.style.display = 'none';
    workspaceEl.style.display = 'flex';
    previewEl.src = 'file://' + result.path;

    const info = result.info;
    infoEl.innerHTML = info ? `
      Duration: ${info.duration_seconds}s<br>
      Resolution: ${info.width}x${info.height}<br>
      FPS: ${info.fps}<br>
      Codec: ${info.codec}
    ` : 'Could not read video info.';

    const project = result.project || {};
    headerTitleEl.textContent = project.name || 'Scenecraft';
    renderScenes(project.scenes);

    currentTranscript = project.transcript || [];
    transcriptSearchEl.value = '';
    transcriptStatusEl.textContent = currentTranscript.length ? `${currentTranscript.length} segments` : '';
    renderTranscript(currentTranscript);
  }

  async function openVideo() {
    const result = await window.pywebview.api.pick_video_file();
    if (!result) return;
    hydrateProject(result);
  }

  function startProjectFlow() {
    showModal('Start a project');
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = 'Project name';
    modalBodyEl.appendChild(input);
    setTimeout(() => input.focus(), 0);

    const submit = async () => {
      const name = input.value.trim();
      if (!name) return;
      hideModal();
      const result = await window.pywebview.api.start_project(name);
      if (!result) return; // user cancelled the file dialog
      if (result.error) { alert(result.error); return; }
      hydrateProject(result);
    };
    input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
    modalConfirmEl.onclick = submit;
  }

  async function openProjectFlow() {
    const projects = await window.pywebview.api.list_projects();
    showModal('Open project');
    modalConfirmEl.style.display = 'none';

    if (!projects.length) {
      const p = document.createElement('p');
      p.style.color = 'var(--text-muted)';
      p.textContent = 'No saved projects found in ~/Scenecraft.';
      modalBodyEl.appendChild(p);
      return;
    }

    const list = document.createElement('div');
    list.className = 'project-list';
    projects.forEach(proj => {
      const row = document.createElement('div');
      row.className = 'project-row';
      row.textContent = proj.name;
      row.addEventListener('click', async () => {
        hideModal();
        const result = await window.pywebview.api.open_project(proj.path);
        if (result.error) { alert(result.error); return; }
        hydrateProject(result);
      });
      list.appendChild(row);
    });
    modalBodyEl.appendChild(list);
  }

  async function cutScene() {
    const start = parseFloat(document.getElementById('start').value);
    const end = parseFloat(document.getElementById('end').value);
    statusEl.textContent = 'Cutting…';
    const result = await window.pywebview.api.cut_scene(start, end);
    if (result.error) {
      statusEl.textContent = 'Error: ' + result.error;
      return;
    }
    statusEl.textContent = 'Saved ' + result.scene_id;
    refreshScenes();
  }

  async function refreshScenes() {
    const scenes = await window.pywebview.api.get_scenes();
    renderScenes(scenes);
  }

  async function transcribeVideo() {
    transcribeBtnEl.disabled = true;
    transcriptStatusEl.textContent = 'Transcribing… this can take a while.';
    const result = await window.pywebview.api.transcribe();
    transcribeBtnEl.disabled = false;
    if (result.error) {
      transcriptStatusEl.textContent = 'Error: ' + result.error;
      return;
    }
    currentTranscript = result.transcript;
    transcriptStatusEl.textContent = `${currentTranscript.length} segments`;
    renderTranscript(currentTranscript);
  }

  transcriptSearchEl.addEventListener('input', async e => {
    const results = await window.pywebview.api.search_transcript(e.target.value);
    renderTranscript(results);
  });

  document.getElementById('open-btn').addEventListener('click', openVideo);
  document.getElementById('open-btn-2').addEventListener('click', openVideo);
  document.getElementById('start-project-btn').addEventListener('click', startProjectFlow);
  document.getElementById('open-project-btn').addEventListener('click', openProjectFlow);
  document.getElementById('cut-btn').addEventListener('click', cutScene);
  document.getElementById('transcribe-btn').addEventListener('click', transcribeVideo);
  document.getElementById('export-btn').addEventListener('click', () => {
    statusEl.textContent = 'Export coming in the next pass — cutting works first.';
  });
</script>

</body>
</html>
